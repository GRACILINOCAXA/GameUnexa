    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const cleanupModalState = () => {
                document.body.classList.remove('modal-open');
                document.body.style.removeProperty('overflow');
                document.body.style.removeProperty('padding-right');
                document.querySelectorAll('.modal-backdrop').forEach((backdrop) => backdrop.remove());
            };

            const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || '';
            document.querySelectorAll('form').forEach((form) => {
                const method = (form.getAttribute('method') || '').toLowerCase();
                if (method !== 'post' || form.querySelector('input[name="csrf_token"]')) {
                    return;
                }
                const hiddenInput = document.createElement('input');
                hiddenInput.type = 'hidden';
                hiddenInput.name = 'csrf_token';
                hiddenInput.value = csrfToken;
                form.appendChild(hiddenInput);
            });

            document.querySelectorAll('.modal').forEach((modalElement) => {
                modalElement.addEventListener('hidden.bs.modal', cleanupModalState);
            });

            cleanupModalState();
        });

        window.marcarComoLida = function (notifId) {
            const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || '';
            fetch(`/notificacao/${notifId}/marcar-lida`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken }
            }).then(response => {
                if (response.ok) {
                    window.location.reload();
                }
            });
        };
    </script>
    <script>
        (function () {
            const storageKey = 'gamelink_message_count';
            let lastCount = Number(window.localStorage.getItem(storageKey) || '0');

            function tocarAvisoMensagem() {
                try {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) {
                        const audioContext = new AudioContextClass();
                        const oscillator = audioContext.createOscillator();
                        const gainNode = audioContext.createGain();
                        oscillator.type = 'sine';
                        oscillator.frequency.value = 880;
                        gainNode.gain.value = 0.0001;
                        oscillator.connect(gainNode);
                        gainNode.connect(audioContext.destination);
                        oscillator.start();
                        gainNode.gain.exponentialRampToValueAtTime(0.08, audioContext.currentTime + 0.02);
                        gainNode.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.35);
                        oscillator.stop(audioContext.currentTime + 0.38);
                    }
                } catch (error) {
                    console.debug('Aviso sonoro indisponível', error);
                }

                if ('Notification' in window && Notification.permission === 'granted') {
                    try {
                        new Notification('Nova mensagem no GameUnexa', {
                            body: 'Você recebeu uma nova mensagem.',
                            icon: '/static/favicon.ico'
                        });
                    } catch (error) {
                        console.debug('Notificação do navegador indisponível', error);
                    }
                }
            }

            function verificarMensagens() {
                fetch('/mensagens/nao-lidas/contador', { cache: 'no-store' })
                    .then(response => response.json())
                    .then(data => {
                        const count = Number(data.count || 0);
                        if (count > lastCount) {
                            tocarAvisoMensagem();
                        }
                        lastCount = count;
                        window.localStorage.setItem(storageKey, String(count));
                    })
                    .catch(() => {});
            }

            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission().catch(() => {});
            }

            verificarMensagens();
            window.setInterval(verificarMensagens, 7000);
        })();
    </script>
    <script>
        function selectLibraryRating(button, event) {
            if (event) {
                event.preventDefault();
            }

            const form = button.closest('.star-rating-form');
            if (!form) {
                return;
            }

            const rating = Number(button.dataset.rating || 0);
            const hiddenInput = form.querySelector('input[name="nota"]');
            const ratingLabel = form.querySelector('[data-library-rating-value]');
            const choices = form.querySelectorAll('.star-choice');

            if (hiddenInput) {
                hiddenInput.value = String(rating);
            }

            if (ratingLabel) {
                ratingLabel.textContent = rating > 0 ? `${rating} / 5` : 'Sem avaliação';
            }

            choices.forEach((choice) => {
                const choiceRating = Number(choice.dataset.rating || 0);
                choice.classList.toggle('active', rating > 0 ? choiceRating > 0 && choiceRating <= rating : choiceRating === 0);
                choice.setAttribute('aria-pressed', choice.classList.contains('active') ? 'true' : 'false');
            });

            button.classList.remove('bounce');
            void button.offsetWidth;
            button.classList.add('bounce');
            window.setTimeout(() => button.classList.remove('bounce'), 420);
        }
    </script>
