<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ assunto or 'GameUnexa' }}</title>
</head>
<body style="margin:0;padding:0;background:#07111f;font-family:Arial,sans-serif;color:#f8fafc;">
  <div style="max-width:640px;margin:0 auto;padding:24px;">
    <div style="background:linear-gradient(135deg,#0f172a,#1f2937);border:1px solid #334155;border-radius:16px;padding:24px;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
        <div style="width:44px;height:44px;border-radius:12px;background:#2563eb;display:flex;align-items:center;justify-content:center;font-weight:700;color:white;">GL</div>
        <div>
          <div style="font-size:18px;font-weight:700;color:white;">GameUnexa</div>
          <div style="font-size:12px;color:#cbd5e1;">Central de jogos e comunidade</div>
        </div>
      </div>
      {% block content %}{% endblock %}
      <div style="margin-top:24px;padding-top:16px;border-top:1px solid #334155;color:#94a3b8;font-size:12px;">
        Este e-mail foi enviado automaticamente pelo GameUnexa.
      </div>
    </div>
  </div>
</body>
</html>
