{% extends 'emails/base.html' %}
{% block content %}
  <h2 style="margin:0 0 16px;font-size:24px;color:#ffffff;">{{ titulo }}</h2>
  <div style="color:#cbd5e1;line-height:1.7;">
    <p><strong>Protocolo:</strong> {{ protocolo }}</p>
    <p><strong>Mensagem:</strong><br/>{{ mensagem }}</p>
    <p><strong>Status atual:</strong> {{ status_atual }}</p>
    <p style="margin-top:20px;"><a href="{{ link }}" style="display:inline-block;padding:12px 18px;border-radius:999px;background:#2563eb;color:#ffffff;text-decoration:none;font-weight:700;">Ver resposta</a></p>
  </div>
  <p style="margin-top:18px;color:#94a3b8;line-height:1.6;">Caso haja anexos ao chamado, eles podem ser visualizados diretamente no painel de suporte.</p>
{% endblock %}
